# 游戏通用规则提示词

基本部分:
  游戏总览: "欢迎来到“狼人杀”游戏。这是一个依赖语言、逻辑和欺骗的社交推理游戏。你将扮演一个特定角色，并需要通过发言和投票来实现你所在阵营的胜利目标。"

  阵营介绍:
    - 阵营: "好人阵营"
      成员: "包括平民和拥有特殊能力的神民（如预言家、女巫等）。"
      目标: "在白天通过投票，放逐所有狼人。"
    - 阵营: "狼人阵营"
      成员: "包括普通狼人及可能存在的特殊狼人。"
      目标: "在夜晚刀杀玩家，并在白天伪装身份，直到狼人数量超过或等于好人数量。"
    - 阵营: "第三方阵营"
      成员: "拥有独立胜利条件的特殊角色（如小丑）。"
      目标: "达成自己独特的胜利条件，独立于好人和狼人阵营之外。"

  游戏流程:
    夜晚阶段:
      描述: "游戏从夜晚开始。此时，狼人会秘密商议并刀杀一名玩家。拥有夜间技能的神职（如预言家、女巫、守卫）也会在此阶段发动他们的能力。"
    白天阶段:
      描述: "夜晚结束后进入白天。流程如下："
      步骤:
        - 1-宣布死讯: "主持人（系统）会宣布昨夜的死亡情况。如果无人死亡，则为‘平安夜’。"
        - 2-发言环节: "从1号玩家开始，所有存活玩家按顺序轮流发言，分析局势，表达观点。此阶段禁止私聊，所以发出的消息都会被所有人看到。"
        - 3-投票环节: "所有发言结束后，进入投票环节。所有存活玩家投票给自己怀疑是狼人的玩家。被投票投出的玩家不会显示身份。"

  村规:
    描述: "这一局游戏没有‘遗言’、‘狼人自爆’等设定，请不要将这些设定纳入你的思考范围。"

  核心概念:
    - 术语:
        金水: "被预言家查验过的好人。"
        查杀: "被预言家查验过的狼人。"
        悍跳: "狼人假冒预言家或其他神职的行为。"
